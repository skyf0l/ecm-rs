[package]
name = "ecm"
version = "1.0.2"
edition = "2021"
authors = ["skyf0l <skyf0lmails@proton.me>"]
description = "Lenstra's Elliptic Curve Factorization Implementation with Big Integers"
repository = "https://github.com/skyf0l/ecm-rs"
license = "LGPL-3.0-or-later"
categories = ["mathematics"]
keywords = ["number-theory", "primes", "lenstra", "ECM", "bignum"]
include = [
  "benches/**/*",
  "src/**/*",
  "Cargo.toml",
  "COPYING*",
  "LICENSE*",
  "README.md",
]
readme = "README.md"

[profile.dev]
opt-level = 3

[profile.test]
opt-level = 3

[profile.bench]
opt-level = 3
debug = true

[features]
default = []
progress-bar = ["indicatif"]
# Exposes internals (`ecm::bench`) for benchmarks. Not part of the public API.
bench = []

[dependencies]
indicatif = { version = "0.18", optional = true }
primal = "0.3"
thiserror = "2.0"

[dependencies.rug]
version = "1.26"
default-features = false
features = ["integer", "rand"]

[dev-dependencies]
criterion = "0.8"
# Must match the installed `gungraun-runner` version exactly.
gungraun = "=0.19.4"
serde_json = "1.0.151"

[lib]
bench = false

# Instruction counts (Valgrind), deterministic: point ops, one curve, setup costs.
[[bench]]
name = "ops"
harness = false
required-features = ["bench"]

# Instruction counts (Valgrind), deterministic: end-to-end factorization of small numbers.
[[bench]]
name = "e2e"
harness = false
required-features = ["bench"]

# Wall-clock time (criterion), local use only: too noisy for shared CI runners.
[[bench]]
name = "walltime"
harness = false
required-features = ["bench"]

# Curve success rate per factor size: expected curves to find a factor.
[[example]]
name = "success_rate"
required-features = ["bench"]
