[package]
name = "ecm"
version = "1.0.2"
edition = "2024"
# The library (not the benches: their dev-dependencies need 1.90), checked by CI.
rust-version = "1.87"
authors = ["skyf0l <skyf0lmails@proton.me>"]
description = "Lenstra's Elliptic Curve Factorization Implementation with Big Integers"
repository = "https://github.com/skyf0l/ecm-rs"
license = "LGPL-3.0-or-later"
categories = ["mathematics"]
keywords = ["number-theory", "primes", "lenstra", "ECM", "bignum"]
include = [
  "benches/**/*",
  "CHANGELOG.md",
  "examples/**/*",
  "src/**/*",
  "tests/**/*",
  "Cargo.toml",
  "COPYING*",
  "LICENSE*",
  "README.md",
]
readme = "README.md"

[profile.dev]
opt-level = 3

[profile.test]
opt-level = 3

[profile.bench]
opt-level = 3
debug = true

# Wall-clock benchmarks with the optimizations of a final build (`cargo bench --profile
# bench-lto ...`): instruction counts don't see their effects (inlining, carry chain spills).
[profile.bench-lto]
inherits = "bench"
lto = "fat"
codegen-units = 1

[features]
default = []
# Exposes internals (`ecm::bench`) for benchmarks. Not part of the public API.
bench = []

[dependencies]
# GMP's low-level functions, for the largest Montgomery sizes (the same GMP that rug uses).
gmp-mpfr-sys = { version = "1.6", default-features = false }
primal = "0.3"
thiserror = "2.0"

[dependencies.rug]
version = "1.26"
default-features = false
features = ["integer", "rand", "std"]

[dev-dependencies]
criterion = "0.8"
# Must match the installed `gungraun-runner` version exactly.
gungraun = "=0.19.4"
serde_json = "1.0.151"

[lib]
bench = false

# Instruction counts (Valgrind), deterministic: modular arithmetic, stages of one curve, setup.
[[bench]]
name = "ops"
harness = false
required-features = ["bench"]

# Instruction counts (Valgrind), deterministic: driver overhead, factorizations of small numbers.
[[bench]]
name = "e2e"
harness = false
required-features = ["bench"]

# Wall-clock time (criterion) of one curve's stages, local use only: too noisy for CI runners.
[[bench]]
name = "walltime"
harness = false
required-features = ["bench"]

# Curve success rate per factor size: expected curves to find a factor.
[[example]]
name = "success_rate"
required-features = ["bench"]

# Wall-clock time per curve, the input of scripts/compare_gmp_ecm.sh.
[[example]]
name = "per_curve"
required-features = ["bench"]
