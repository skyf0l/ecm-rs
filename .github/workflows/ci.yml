name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7
    - name: Stable toolchain with rustfmt
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - uses: swatinem/rust-cache@v2

    - name: Check coding style
      run: cargo fmt --check --all

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7
    - name: Stable toolchain with clippy
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: swatinem/rust-cache@v2

    - name: Lint
      run: cargo clippy --all-targets  --all-features -- -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7
    # The `rust-version` of Cargo.toml: the library and the `ecm-rs` tool (the
    # dev-dependencies need a newer toolchain).
    - uses: dtolnay/rust-toolchain@1.87
    - uses: swatinem/rust-cache@v2

    - name: Check
      run: cargo check --lib --all-features

    - name: Check the command line tool
      run: cargo check --bins --features cli

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTDOCFLAGS: "-Dwarnings"

    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - uses: swatinem/rust-cache@v2

    - run: cargo doc --no-deps

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - uses: swatinem/rust-cache@v2
    - uses: taiki-e/install-action@cargo-nextest

    - name: Test
      run: cargo nextest run --all-features

  build:
    name: Build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7

    # Non-Windows platforms use regular Rust toolchain
    - uses: dtolnay/rust-toolchain@stable
      if: matrix.os != 'windows-latest'
    - uses: swatinem/rust-cache@v2
      if: matrix.os != 'windows-latest'

    # Windows: Setup MSYS2 with Rust and required tools
    - name: Setup msys2 (windows)
      uses: msys2/setup-msys2@v2
      if: matrix.os == 'windows-latest'
      with:
        msystem: MINGW64
        update: true
        install: >-
          base-devel
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-rust
          diffutils
          m4
          make

    # Build using MSYS2 Rust on Windows
    - name: Build (windows)
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      run: |
        cargo build
        cargo build --features cli

    - name: Build
      if: matrix.os != 'windows-latest'
      run: cargo build

    - name: Build the command line tool
      if: matrix.os != 'windows-latest'
      run: cargo build --features cli

  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs: [fmt, clippy, msrv, docs, tests, build]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7

    - uses: dtolnay/rust-toolchain@stable

    - run: cargo publish --token ${CRATES_TOKEN}
      env:
        CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
